<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Siswa</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background: linear-gradient(135deg,#2193b0,#6dd5ed);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .card{
        width:350px;
        background:#fff;
        border-radius:20px;
        box-shadow:0 10px 20px rgba(0,0,0,.2);
        overflow:hidden;
        text-align:center;
    }

    .header{
        background:#0077b6;
        color:white;
        padding:30px 20px;
    }

    .avatar{
        width:100px;
        height:100px;
        border-radius:50%;
        background:white;
        color:#0077b6;
        font-size:50px;
        font-weight:bold;
        display:flex;
        justify-content:center;
        align-items:center;
        margin:0 auto 15px;
    }

    .content{
        padding:25px;
    }

    .info{
        margin:15px 0;
        font-size:18px;
        color:#333;
    }

    .favorite{
        background:#f1f5f9;
        padding:15px;
        border-radius:12px;
        margin-top:20px;
        font-size:17px;
    }

    .favorite span{
        font-size:30px;
    }

    .footer{
        background:#0077b6;
        color:white;
        padding:12px;
        font-size:14px;
    }
</style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="avatar">DS</div>
        <h2>Dhia Syarafana Surya</h2>
    </div>

    <div class="content">
        <div class="info">
            <strong>Kelas:</strong> XII RPL¹
        </div>

        <div class="favorite">
            <span>🌯</span><br>
            <strong>Makanan Favorit</strong><br>
            Kebab Daging + Ayam
        </div>
    </div>

    <div class="footer">
        Profil Siswa
    </div>
</div>

</body>
</html>
